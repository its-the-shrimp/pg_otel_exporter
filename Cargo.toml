[package]
name = "pg_otel_exporter"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "0.19.3"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = "0.14"
crossbeam-channel = "0.5"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["experimental_metrics_custom_reader"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
libc = "0.2"

[dependencies.pgrx-bench]
version = "=0.19.3"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

[lints.clippy]
# complexity = { level = "warn", priority = -1 }
unit_arg = "allow"
too_many_arguments = "allow"

# restriction = { level = "allow", priority = -1 }
unwrap_used = "warn"
deref_by_slicing = "warn"
infinite_loop = "warn"
mixed_read_write_in_expression = "warn"
exit = "warn"

pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"

nursery = { level = "warn", priority = -1 }
option_if_let_else = "allow"
or_fun_call = "allow"
